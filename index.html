```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR PDF Maker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background:
        radial-gradient(circle at top right, #263b78, transparent 35%),
        radial-gradient(circle at bottom left, #4d245f, transparent 35%),
        #080b13;
    color: white;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 35px 20px 20px;
}

.logo {
    display: inline-block;
    padding: 10px 18px;
    border-radius: 14px;
    background: linear-gradient(135deg, #4169ff, #7c3cff);
    box-shadow: 0 10px 40px #315efb55;
    font-size: 14px;
    font-weight: bold;
}

h1 {
    margin: 15px 0 5px;
    font-size: 34px;
}

.subtitle {
    color: #aeb7c9;
}

.container {
    width: min(1200px, 94%);
    margin: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding-bottom: 40px;
}

.panel {
    background: rgba(20, 25, 37, 0.88);
    border: 1px solid #ffffff12;
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 20px 60px #00000055;
    backdrop-filter: blur(12px);
}

.panel-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
}

textarea {
    width: 100%;
    height: 470px;
    resize: vertical;
    border: 1px solid #ffffff15;
    border-radius: 16px;
    outline: none;
    padding: 20px;
    background: #0c1019;
    color: white;
    font-family: Tahoma, Arial, sans-serif;
    font-size: 17px;
    line-height: 2;
}

textarea:focus {
    border-color: #4169ff;
    box-shadow: 0 0 0 3px #4169ff18;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 15px;
}

button,
select,
input {
    font-family: Tahoma, Arial, sans-serif;
}

button {
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    cursor: pointer;
    font-weight: bold;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
}

.pdf-btn {
    background: linear-gradient(135deg, #4169ff, #713cff);
    color: white;
    flex: 1;
}

.clear-btn {
    background: #292f3d;
    color: white;
}

.settings {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}

.setting {
    background: #0d111a;
    padding: 12px;
    border-radius: 12px;
}

.setting label {
    display: block;
    color: #9ca7ba;
    font-size: 12px;
    margin-bottom: 7px;
}

.setting input,
.setting select {
    width: 100%;
    border: 1px solid #ffffff12;
    background: #171d29;
    color: white;
    padding: 9px;
    border-radius: 8px;
    outline: none;
}

.preview-wrapper {
    background: #252a34;
    border-radius: 16px;
    padding: 20px;
    height: 600px;
    overflow: auto;
}

.paper {
    background: white;
    color: #111;
    width: 210mm;
    min-height: 297mm;
    padding: 20mm;
    margin: auto;
    box-shadow: 0 10px 40px #00000055;
    direction: rtl;
    text-align: right;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 16px;
    line-height: 2;
}

.counter {
    color: #778399;
    font-size: 12px;
    margin-top: 8px;
}

@media (max-width: 850px) {
    .container {
        grid-template-columns: 1fr;
    }

    .paper {
        transform-origin: top right;
        width: 100%;
        min-height: 600px;
    }

    .preview-wrapper {
        height: 500px;
    }
}

@media print {
    body {
        background: white;
        margin: 0;
    }

    header,
    .editor,
    .preview-title {
        display: none !important;
    }

    .container {
        display: block;
        width: 100%;
        margin: 0;
        padding: 0;
    }

    .panel {
        padding: 0;
        border: none;
        box-shadow: none;
        background: white;
    }

    .preview-wrapper {
        padding: 0;
        overflow: visible;
        height: auto;
        background: white;
    }

    .paper {
        width: 210mm;
        min-height: 297mm;
        margin: 0;
        padding: 20mm;
        box-shadow: none;
    }

    @page {
        size: A4;
        margin: 0;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">AR PDF MAKER</div>

    <h1>تبدیل متن به PDF</h1>

    <div class="subtitle">
        متن خودت را بنویس، پیش‌نمایش را ببین و PDF بگیر
    </div>
</header>


<div class="container">

    <!-- EDITOR -->
    <section class="panel editor">

        <div class="panel-title">
            📝 متن شما
        </div>

        <textarea
            id="textInput"
            placeholder="متنت را اینجا بنویس..."
            spellcheck="false"
        ></textarea>

        <div class="counter">
            تعداد کاراکترها:
            <span id="counter">0</span>
        </div>


        <div class="settings">

            <div class="setting">
                <label>اندازه متن</label>

                <select id="fontSize">
                    <option value="12">12</option>
                    <option value="14">14</option>
                    <option value="16" selected>16</option>
                    <option value="18">18</option>
                    <option value="20">20</option>
                    <option value="24">24</option>
                </select>
            </div>


            <div class="setting">
                <label>فاصله خطوط</label>

                <select id="lineHeight">
                    <option value="1.5">1.5</option>
                    <option value="1.8">1.8</option>
                    <option value="2" selected>2</option>
                    <option value="2.3">2.3</option>
                    <option value="2.5">2.5</option>
                </select>
            </div>

        </div>


        <div class="controls">

            <button
                class="pdf-btn"
                onclick="printPDF()"
            >
                📄 خروجی PDF
            </button>

            <button
                class="clear-btn"
                onclick="clearText()"
            >
                پاک کردن
            </button>

        </div>

    </section>


    <!-- PREVIEW -->
    <section class="panel">

        <div class="panel-title preview-title">
            👀 پیش‌نمایش
        </div>

        <div class="preview-wrapper">

            <div
                class="paper"
                id="paper"
            >
                متن شما اینجا نمایش داده می‌شود...
            </div>

        </div>

    </section>

</div>


<script>

const textInput = document.getElementById("textInput");
const paper = document.getElementById("paper");
const counter = document.getElementById("counter");

const fontSize = document.getElementById("fontSize");
const lineHeight = document.getElementById("lineHeight");


function updatePreview() {

    let text = textInput.value;

    counter.textContent = text.length;

    if (text.trim() === "") {

        paper.textContent =
            "متن شما اینجا نمایش داده می‌شود...";

    } else {

        paper.textContent = text;

    }

    paper.style.fontSize =
        fontSize.value + "px";

    paper.style.lineHeight =
        lineHeight.value;
}


textInput.addEventListener(
    "input",
    updatePreview
);

fontSize.addEventListener(
    "change",
    updatePreview
);

lineHeight.addEventListener(
    "change",
    updatePreview
);


function clearText() {

    textInput.value = "";

    updatePreview();

    textInput.focus();
}


function printPDF() {

    if (textInput.value.trim() === "") {

        alert("اول یک متن وارد کن!");

        textInput.focus();

        return;
    }

    window.print();
}


updatePreview();

</script>

</body>
</html>
```
